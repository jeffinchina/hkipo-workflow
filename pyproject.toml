[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hkipo-workflow"
version = "0.1.0"
description = "港股新股监控、独立复核与私有草稿工作流"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.26,<2", "Pillow>=11,<13", "python-docx>=1.1,<2", "PyYAML>=6,<7"]

[tool.setuptools]
package-dir = {"" = "runtime"}
packages = ["hkipo"]

[tool.setuptools.package-data]
hkipo = ["*.md"]
